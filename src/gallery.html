<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heartly - image gallery</title>
    <link rel="stylesheet" href="/static/gallery_style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="/static/theme.js"></script>
</head>
<body>
    <header class="top">
        <a href="/" class="back">
            <b><i class="ph-bold ph-caret-left"></i> <b>Back</b></b>
        </a>
        <h3 class="nav-title">Image Gallery</h3>
        <div class="nav-spacer"></div>
    </header>

    <main class="gallery-wrapper">
        {% if images %}
            {% for img in images %}
                <div class="gallery-card">
                    <img src="/static/gallery/{{ img }}" alt="image" loading="lazy">
                </div>
            {% endfor %}
        {% endif %}
    </main>

</body>
</html>
